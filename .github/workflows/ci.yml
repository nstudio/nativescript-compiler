name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, layers, CLI extension & adapter checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout NativeScript core (for XML/expression-parser checks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NativeScript/NativeScript
          ref: main
          path: core
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install workspace dependencies
        run: |
          npm install --no-audit --no-fund
          for t in packages/*/tests/package-lock.json; do npm ci --prefix "$(dirname "$t")" --no-audit --no-fund; done
          npm ci --prefix core --no-audit --no-fund

      - name: Typecheck compiler and adapters
        run: npm run typecheck

      - name: Compiler layers, CLI extension, and expression-parser parity
        env:
          NS_CORE_REPO: ${{ github.workspace }}/core
        run: npm run test:compiler

      - name: Build compiler dist & adapters
        run: |
          npm run build:compiler
          for pkg in angular vue svelte react solid octane; do
            node packages/compiler/bin/ns-compiled-adapter.js build "packages/${pkg}"
          done

      - name: Adapter release checks (Angular & Canvas)
        run: |
          SUITE=angular npm run test:release-checks
          SUITE=nativescript-canvas npm run test:release-checks
