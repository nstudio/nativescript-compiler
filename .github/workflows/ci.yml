name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, layers, CLI extension & canvas checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout NativeScript core (for expression-parser parity)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NativeScript/NativeScript
          ref: main
          path: core
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install workspace dependencies
        run: |
          npm install --no-audit --no-fund
          npm ci --prefix packages/compiler/tests --no-audit --no-fund
          npm ci --prefix packages/nativescript-canvas/tests --no-audit --no-fund
          npm ci --prefix core --no-audit --no-fund

      - name: Typecheck compiler and adapters
        run: npm run typecheck

      - name: Compiler layers, CLI extension, and expression-parser parity
        env:
          NS_CORE_REPO: ${{ github.workspace }}/core
        run: npm run test:compiler

      - name: Backend parity, twins & runtime ops checks
        run: |
          node packages/compiler/tests/checks/twins.ts
          node packages/compiler/tests/checks/runtime-ops.ts
          node packages/compiler/tests/checks/both-backends.ts

      - name: Build compiler dist & adapters
        run: |
          npm run build:compiler
          for pkg in angular vue svelte react solid octane; do
            node packages/compiler/bin/ns-compiled-adapter.js build "packages/${pkg}"
          done

      - name: Canvas binding release checks
        run: SUITE=nativescript-canvas npm run test:release-checks

  windows-smoke:
    name: Windows typecheck, CLI extension & path/Gradle smoke (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Java (for gradlew.bat smoke check)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install workspace dependencies
        run: |
          npm install --no-audit --no-fund
          npm ci --prefix packages/compiler/tests --no-audit --no-fund

      - name: Typecheck compiler & adapters
        run: npm run typecheck

      - name: Layers & CLI extension checks (Windows)
        run: |
          node packages/compiler/tests/checks/layers.ts
          node packages/compiler/tests/cli/extension.ts

      - name: Windows virtual path, Kotlin codegen & Gradle wrapper smoke check
        shell: pwsh
        run: |
          @'
          import { existsSync, mkdtempSync, rmSync, writeFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import ts from 'typescript';
          import { createProgram } from './packages/compiler/src/program/program.ts';
          import { gradleWrapper, KIT_ANDROID } from './packages/compiler/src/driver/paths.ts';
          import { Translator as KotlinTranslator } from './packages/compiler/src/kotlin/translator.ts';
          import { addKotlinInterfaces, translateKotlinModules } from './packages/compiler/src/kotlin/app-modules.ts';
          if (!existsSync(join(KIT_ANDROID, 'gradlew.bat'))) throw new Error('missing gradlew.bat');
          const cmd = gradleWrapper(['--version'], KIT_ANDROID);
          if (!/cmd\.exe$/i.test(cmd.command) || !cmd.args.some((a) => a.endsWith('gradlew.bat'))) {
            throw new Error('unexpected gradleWrapper on win32: ' + JSON.stringify(cmd));
          }
          const dir = mkdtempSync(join(tmpdir(), 'ns-win-smoke-'));
          try {
            const root = join(dir, 'win.release.ts');
            const iface = join(dir, 'types.ts');
            writeFileSync(iface, 'export interface WinConfig { host: string; port: number; }\n');
            const virtual = new Map([[root, "import type { WinConfig } from './types';\nexport const cfg: WinConfig = { host: 'localhost', port: 8080 };\n"]]);
            const prog = createProgram([root, iface], virtual, 'android', join(process.cwd(), 'packages/compiler/tests/node_modules'));
            const sf = prog.program.getSourceFile(root);
            const diags = ts.getPreEmitDiagnostics(prog.program, sf);
            if (!sf || diags.length) throw new Error('Windows virtual .release.ts failed: ' + diags.map((d) => d.messageText).join('; '));
            const kt = new KotlinTranslator(prog.checker, new Map(), prog.files, { errors: [] });
            const mods = translateKotlinModules(kt, prog.program, [root, iface]);
            addKotlinInterfaces(kt, mods);
            const ifaceMod = mods.find((m) => m.file.replace(/\\/g, '/') === iface.replace(/\\/g, '/'));
            if (!ifaceMod || !ifaceMod.code.includes('class WinConfig')) throw new Error('Windows interfacesOf dropped WinConfig: ' + ifaceMod?.code);
            console.log('Windows smoke passed:', cmd.command, cmd.args.join(' '));
          } finally {
            rmSync(dir, { recursive: true, force: true });
          }
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\packages\compiler\kit-android\gradlew.bat --version
