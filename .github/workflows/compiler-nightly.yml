name: Compiler Nightly & Conformance

# Runs the full Kotlin and Swift differential suites against Node.js, decision-parity checks,
# worker/runtime suites, release checks, and (optionally) Test262, publishing a commit-pinned
# conformance summary artifact and job summary.

on:
  schedule:
    - cron: '0 6 * * *'
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      run_test262:
        description: 'Also run the Test262 conformance selection (long-running)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: compiler-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kotlin-conformance:
    name: Kotlin differential, worker & release conformance (Linux)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'nightly') ||
      contains(github.event.pull_request.labels.*.name, 'test262') ||
      contains(github.event.pull_request.labels.*.name, 'decision-parity')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install kotlinc 2.2.20
        run: |
          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip -o /tmp/kotlinc.zip
          unzip -q /tmp/kotlinc.zip -d /tmp/kotlinc-dist
          echo "/tmp/kotlinc-dist/kotlinc/bin" >> "$GITHUB_PATH"
          /tmp/kotlinc-dist/kotlinc/bin/kotlinc -version

      - name: Install workspace dependencies
        run: |
          npm install --no-audit --no-fund
          npm ci --prefix packages/compiler/tests --no-audit --no-fund

      - name: Run Kotlin differential suite against Node.js
        run: |
          mkdir -p conformance-out
          node packages/compiler/tests/diff/run.ts --kotlin --json conformance-out/diff-kotlin.json

      - name: Run Kotlin worker & runtime concurrency checks
        run: node packages/compiler/tests/worker/run.ts --kotlin

      - name: Run Test262 selection (Kotlin)
        if: >-
          github.event_name == 'schedule' ||
          inputs.run_test262 == true ||
          contains(github.event.pull_request.labels.*.name, 'test262')
        run: node packages/compiler/tests/test262/run.ts --kotlin

      - name: Summarize Kotlin conformance
        if: always()
        run: |
          node --input-type=module -e '
            import { existsSync, readFileSync, writeFileSync } from "node:fs";
            const file = "conformance-out/diff-kotlin.json";
            if (!existsSync(file)) process.exit(0);
            const data = JSON.parse(readFileSync(file, "utf8"));
            const entries = Array.isArray(data) ? data : Object.values(data.results ?? data);
            const counts = {};
            for (const e of entries) {
              const s = typeof e === "string" ? e : (e?.status ?? "unknown");
              counts[s] = (counts[s] ?? 0) + 1;
            }
            const summary = { commit: process.env.GITHUB_SHA, backend: "kotlin", total: entries.length, counts };
            writeFileSync("conformance-out/summary-kotlin.json", JSON.stringify(summary, null, 2));
            const lines = ["## Kotlin Conformance (`" + process.env.GITHUB_SHA.slice(0, 10) + "`)", "", "| Outcome | Count |", "|---|---:|", ...Object.entries(counts).map(([k, v]) => `| ${k} | ${v} |`)];
            if (process.env.GITHUB_STEP_SUMMARY) writeFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n", { flag: "a" });
            console.log(lines.join("\n"));
          '

      - name: Upload Kotlin conformance artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: conformance-kotlin
          path: conformance-out/
          if-no-files-found: ignore

  swift-conformance:
    name: Swift differential, decision-parity & worker conformance (macOS)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'nightly') ||
      contains(github.event.pull_request.labels.*.name, 'test262') ||
      contains(github.event.pull_request.labels.*.name, 'decision-parity')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install workspace dependencies
        run: |
          npm install --no-audit --no-fund
          npm ci --prefix packages/compiler/tests --no-audit --no-fund

      - name: Run Swift differential suite against Node.js
        run: |
          mkdir -p conformance-out
          node packages/compiler/tests/diff/run.ts --swift --json conformance-out/diff-swift.json

      - name: Run decision-parity check (merge set)
        run: node packages/compiler/tests/checks/decision-parity.ts --set merge

      - name: Run Swift worker checks
        run: node packages/compiler/tests/worker/run.ts --swift

      - name: Run Test262 selection (Swift)
        if: >-
          github.event_name == 'schedule' ||
          inputs.run_test262 == true ||
          contains(github.event.pull_request.labels.*.name, 'test262')
        run: node packages/compiler/tests/test262/run.ts --swift

      - name: Summarize Swift conformance
        if: always()
        run: |
          node --input-type=module -e '
            import { existsSync, readFileSync, writeFileSync } from "node:fs";
            const file = "conformance-out/diff-swift.json";
            if (!existsSync(file)) process.exit(0);
            const data = JSON.parse(readFileSync(file, "utf8"));
            const entries = Array.isArray(data) ? data : Object.values(data.results ?? data);
            const counts = {};
            for (const e of entries) {
              const s = typeof e === "string" ? e : (e?.status ?? "unknown");
              counts[s] = (counts[s] ?? 0) + 1;
            }
            const summary = { commit: process.env.GITHUB_SHA, backend: "swift", total: entries.length, counts };
            writeFileSync("conformance-out/summary-swift.json", JSON.stringify(summary, null, 2));
            const lines = ["## Swift Conformance (`" + process.env.GITHUB_SHA.slice(0, 10) + "`)", "", "| Outcome | Count |", "|---|---:|", ...Object.entries(counts).map(([k, v]) => `| ${k} | ${v} |`)];
            if (process.env.GITHUB_STEP_SUMMARY) writeFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n", { flag: "a" });
            console.log(lines.join("\n"));
          '

      - name: Upload Swift conformance artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: conformance-swift
          path: conformance-out/
          if-no-files-found: ignore
